<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#09283c"><title>Golf AI Caddie</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans KR",sans-serif;background:#edf3f7;color:#10202b}button,input{font:inherit}.shell{min-height:100vh;display:grid;grid-template-columns:185px 1fr}.side{background:#09283c;color:#fff;position:sticky;top:0;height:100vh;padding:15px 0}.logo{font-size:28px;font-weight:900;padding:0 18px 16px;color:#58c8e9}.logo small{font-size:10px;color:#42c58a;display:block}.nav button{width:100%;border:0;background:transparent;color:#fff;text-align:left;padding:15px 22px;font-weight:700}.nav button.active{background:#0870df}.clubs{margin:16px 12px;padding:12px;border:1px solid #2679a8;border-radius:8px;font-size:12px;line-height:1.8}.main{min-width:0}.top{height:72px;background:#fff;display:flex;align-items:center;border-bottom:1px solid #d8e0e6;padding:8px 12px;gap:18px}.date{border:1px solid #9fb7d2;border-radius:10px;padding:7px 14px;text-align:center;color:#0b4c9c;font-weight:800}.date b{display:block;color:#e53c45}.title{font-size:25px;font-weight:900;flex:1}.stat{padding:0 18px;border-left:1px solid #dde4e9;font-size:12px}.stat b{display:block;font-size:17px;margin-top:3px}.weather{font-size:13px}.tabs{display:grid;grid-template-columns:1.4fr repeat(5,1fr);gap:4px;padding:5px 10px;background:#f5f7f9}.tabs button{border:1px solid #dde3e8;background:#fff;padding:10px;font-weight:800;color:#063b7a}.tabs .live{background:#ee3542;color:#fff}.rotation{display:grid;grid-template-columns:1fr 1fr 350px;gap:8px;padding:0 10px}.rot{height:84px;border-radius:7px;padding:9px 14px;color:#fff;font-size:20px;font-weight:900;background:linear-gradient(90deg,#075eb8,#143c69)}.rot.m{background:linear-gradient(90deg,#ad4908,#6d2e08)}.holes{display:flex;gap:6px;margin-top:8px}.holes button{width:36px;height:36px;border:0;border-radius:50%;font-weight:800}.holes .on{background:#0866c6;color:#fff}.m .holes .on{background:#c44d08}.rotinfo{background:#fff;border:1px solid #dce3e8;border-radius:7px;padding:9px 12px;font-size:12px}.boards{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px 10px}.board{background:#fff;border:1px solid #d9e1e7;border-radius:8px;overflow:hidden}.bh{background:#075eb8;color:#fff;padding:9px 13px;font-size:22px;font-weight:900}.board.mount .bh{background:#ad4908}.content{display:grid;grid-template-columns:45% 55%;min-height:570px}.map{position:relative;background:linear-gradient(#8ec7e8 0 8%,#397944 8%);overflow:hidden}.fair{position:absolute;left:34%;top:8%;width:32%;height:86%;background:#8bc766;border-radius:45% 55% 38% 42%;box-shadow:0 0 0 11px #2f6c38}.green{position:absolute;left:35%;top:4%;width:30%;height:14%;border-radius:50%;background:#b4dc75}.water{position:absolute;right:-22%;top:15%;width:52%;height:62%;background:#43a7d0;border-radius:48%}.mount .water{right:auto;left:-22%}.haztag{position:absolute;background:#111;color:#fff;border:2px solid #ff3d3d;border-radius:4px;padding:3px 5px;font-size:11px;font-weight:800}.teeMark{position:absolute;left:46%;bottom:5%;width:18px;height:18px;border-radius:50%;background:#fff;border:4px solid #1670d2}.range200{position:absolute;left:51%;bottom:48%;color:#fff;font-weight:900;text-shadow:0 2px 3px #000}.range150{position:absolute;left:51%;bottom:30%;color:#fff;font-weight:900;text-shadow:0 2px 3px #000}.landing{position:absolute;width:58px;height:58px;border:2px dashed #fff;border-radius:50%;background:#ffffff18;transform:translate(-50%,50%)}.landing:after{content:"예상 낙하";position:absolute;top:59px;left:-3px;color:#fff;font-size:10px;font-weight:800;white-space:nowrap;text-shadow:0 1px 2px #000}.aimline{position:absolute;width:3px;background:#7ce7ff;transform-origin:bottom;bottom:10%;left:49%;opacity:.9}.riskwarn{background:#fff1f0;color:#b42318;border:1px solid #ffc9c5;border-radius:5px;padding:6px;margin-top:6px;font-weight:800}.bunker{position:absolute;width:44px;height:19px;background:#f0dfa5;border-radius:50%}.b1{left:26%;top:31%}.b2{left:62%;top:19%}.path{position:absolute;left:49%;bottom:11%;width:3px;height:63%;background:#b7efff;transform:rotate(-3deg)}.dot{position:absolute;left:46%;bottom:25%;width:13px;height:13px;border-radius:50%;background:red;border:2px solid white}.label{position:absolute;background:#111;color:#fff;border:2px solid #f44;border-radius:4px;padding:4px;font-size:12px;font-weight:800}.ob{right:6%;top:25%}.yard{position:absolute;left:52%;bottom:30%;color:white;font-size:19px;font-weight:900;text-shadow:0 2px 3px #000}.info{padding:9px}.subtabs{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid #dce4e9;border-radius:5px;overflow:hidden}.subtabs button{border:0;border-right:1px solid #dce4e9;background:#fff;padding:8px;font-size:12px}.subtabs button:first-child{background:#075eb8;color:#fff}.section{border:1px solid #e0e6ea;border-radius:5px;padding:8px;margin-top:7px;font-size:12px;line-height:1.55}.section h4{font-size:14px;color:#075eb8;margin:0 0 4px}.mount .section h4{color:#a94509}.recommend{background:#edf8f2;border-radius:6px;padding:8px;margin-top:7px;color:#08743f;font-weight:800}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;padding:0 10px 10px}.actions button{border:0;border-radius:6px;padding:10px;color:#fff;background:#07894a;font-weight:800}.actions button:last-child{background:#0870d9}.mount .actions button:last-child{background:#d34c0a}.progress{position:sticky;bottom:0;background:#fff;border-top:1px solid #d8e1e7;padding:8px 14px;display:flex;gap:12px;align-items:center;font-size:12px}.progress b{margin-right:8px}.pips{display:flex;gap:12px;flex:1}.pip{width:10px;height:10px;border-radius:50%;background:#1769c4}.pip.m{background:#ad4b16}
@media(max-width:900px){.shell{display:block}.side{height:auto;position:relative;padding:8px}.nav,.clubs{display:none}.top{height:auto;flex-wrap:wrap}.stat{padding:4px 8px}.rotation,.boards{grid-template-columns:1fr}.rotinfo{display:none}.content{grid-template-columns:1fr}.map{height:430px}.tabs{grid-template-columns:1fr 1fr}.title{font-size:20px}.boards{padding-bottom:55px}}
</style></head><body><div class="shell"><aside class="side"><div class="logo">⛳ Golf AI<small>AI CADDIE & COACH</small></div><div class="nav"><button>⌂ 홈</button><button>▣ 라운드 일정</button><button class="active">⚑ AI 캐디</button><button>▤ 스코어카드</button><button>♙ 골프장 DB</button><button>♙ 스윙 분석</button><button>♧ 연습/코칭</button><button>⌕ 장비/클럽</button><button>☀ 날씨/바람</button><button>⚙ 설정</button></div><div class="clubs" id="clubList"><b>내 클럽 거리 (평균)</b></div></aside><main class="main"><header class="top"><div class="date">2026. 10. 19 (월)<b>D-12</b></div><div class="title">청도 그레이스CC<small style="display:block;font-size:12px;color:#77858e">경상북도 청도군</small></div><div class="stat">티타임<b>13:10</b></div><div class="stat">인원<b>4인</b></div><div class="stat">그린피<b>150,000원</b></div><div class="stat">캐디<b>정규캐디</b></div><div class="weather">☀️ 청도 날씨<br><b>당일 최신값 확인</b></div></header><div class="tabs"><button class="live">실전 18홀 모드<br><small>Lake 1~9 → Mountain 1~9</small></button><button onclick="showPanel('info')">골프장 정보</button><button onclick="showPanel('rotation')">코스 로테이션</button><button onclick="showPanel('score')">스코어카드</button><button onclick="showPanel('ai')">AI 공략 추천</button><button onclick="showPanel('memo')">메모/사진</button></div><section class="rotation"><div class="rot">전반　LAKE 코스 <small>(Par 36)</small><div class="holes" id="lh"></div></div><div class="rot m">후반　MOUNTAIN 코스 <small>(Par 36)</small><div class="holes" id="mh"></div></div><div class="rotinfo"><b>코스 로테이션 안내</b><br><br><b style="color:#075eb8">Lake</b> 시작 → 후반 <b style="color:#ad4908">Mountain</b><br><small>당일 운영에 따라 변경될 수 있어 스타트하우스에서 최종 확인</small></div></section><section class="boards"><div id="lakeBoard"></div><div id="mountBoard"></div></section><footer class="progress"><b>라운드 진행</b><span>현재 홀</span><div class="pips" id="pips"></div><button onclick="prev()">◀ 이전 홀</button><button onclick="next()">다음 홀 ▶</button></footer></main></div>
<script src="grace-lake.js"></script><script>
const defaults={Driver:220,"3W":200,"5W":180,Utility:170,"5I":160,"6I":150,"7I":140,"8I":130,"9I":120,PW:105,AW:90,SW:80};let clubs=JSON.parse(localStorage.golfClubs||"null")||defaults;clubList.innerHTML+="<br>"+Object.entries(clubs).map(([k,v])=>k+"　"+v+"m").join("<br>");let step=0;
function holes(id,course){let e=document.getElementById(id);for(let i=1;i<=9;i++){let b=document.createElement("button");b.textContent=i;b.onclick=()=>{step=(course==="Lake"?0:9)+i-1;render()};e.appendChild(b)}}
holes("lh","Lake");holes("mh","Mountain");
function nearest(d){let a=Object.entries(clubs).sort((x,y)=>Math.abs(x[1]-d)-Math.abs(y[1]-d));return a[0]?a[0][0]:"클럽"}
const verified={Lake:{4:"우측 해저드 · 세컨드 오르막/그래스벙커",5:"계류·폭포·연못 · 정확성 우선",6:"좌측 해저드 · 팽나무 방향 세컨드",7:"17개 벙커 · 좌측 3번째 벙커 방향",8:"파3 · 절벽형 그린 주의"},Mountain:{4:"약 25m 내리막 · 호수 인접 그린",8:"티박스·페어웨이·그린 분리 지형"}};
function board(course,h){let data=(course==="Lake"?window.graceLake:window.graceMountain)||[];let x=data.find(v=>v.h===h)||{title:"코스 공략",guide:"현장 캐디와 위험구역을 확인하세요.",safe:"페어웨이와 그린 중앙을 우선합니다."};let dist=course==="Lake"?[378,390,165,365,500,380,510,155,400][h-1]:[362,385,410,390,360,400,170,380,510][h-1];let pars=course==="Lake"?[4,4,3,4,5,4,5,3,4]:[4,5,4,3,4,4,3,4,5];let par=pars[h-1];let rec=par===3?nearest(dist):"Driver";let drive=clubs.Driver||220;let remain=Math.max(40,dist-drive);let second=nearest(Math.min(180,remain));let risk=(course==="Lake"&&[4,5,6,7].includes(h))||(course==="Mountain"&&[3,4].includes(h));let aim=risk?"위험 반대편 페어웨이":"페어웨이 중앙";return '<article class="board '+(course==="Mountain"?"mount":"")+'"><div class="bh">'+course.toUpperCase()+' '+h+'H　<small>Par '+par+'　'+dist+'m</small></div><div class="content"><div class="map"><div class="water" style="transform:translateX('+((h%3)-1)*18+'px)"></div><div class="fair" style="transform:rotate('+((h%5)-2)*2+'deg) scaleX('+(0.88+(h%3)*.07)+')"></div><div class="green"></div><div class="bunker b1" style="top:'+(20+(h*7)%48)+'%"></div><div class="bunker b2" style="top:'+(16+(h*11)%55)+'%"></div><div class="path"></div><div class="teeMark"></div><div class="aimline" style="height:'+(42+Math.min(25,(clubs.Driver||220)/12))+'%;transform:rotate('+((h%5)-2)*2+'deg)"></div><div class="landing" style="left:'+(47+((h%3)-1)*5)+'%;bottom:'+(48+Math.min(18,((clubs.Driver||220)-180)/5))+'%"></div><div class="dot"></div><div class="haztag" style="right:5%;top:'+(18+(h*5)%45)+'%">'+(course==="Lake"?"해저드/OB":"OB/해저드")+'</div><div class="range200">200m</div><div class="range150">150m</div></div><div class="info"><div class="subtabs"><button>홀 정보</button><button>공략 가이드</button><button>거리 측정</button><button>메모/사진</button></div><div class="section"><h4>기본 정보</h4><b>'+x.title+'</b><br>Par '+par+' · 기준거리 '+dist+'m<br><b style="color:#b42318">'+((verified[course]&&verified[course][h])||"세부 위험 위치 추가 검증 중")+'</b></div><div class="section"><h4>⚑ 티샷 공략</h4>'+x.guide+'</div><div class="section"><h4>🏌 세컨드 샷 공략</h4>'+x.safe+'</div><div class="section"><h4>⚑ 그린 공략</h4>핀보다 그린 중앙을 기본 목표로 하고 당일 핀 위치와 경사를 확인합니다.<br><b>거리 기준:</b> 지도에 200m·150m 예상 기준선을 표시합니다.</div><div class="recommend">AI 추천 클럽 · 티샷 '+rec+(rec==="Driver"?" "+clubs.Driver+"m":"")+' · 예상 잔여 '+Math.round(remain)+'m · 다음 샷 '+second+'<br>추천 목표: '+aim+'</div>'+(risk?'<div class="riskwarn">⚠ 이 홀은 확인된 위험요소가 있어 최대거리보다 안전한 랜딩존을 우선합니다.</div>':'')</div></div><div class="actions"><button onclick="score()">이 홀로 스코어 기록하기</button><button onclick="next()">다음 홀 ('+(h===9?1:h+1)+'H) →</button></div></article>'}
function render(){let lc=step<9?step+1:9,mc=step>=9?step-8:1;lakeBoard.innerHTML=board("Lake",lc);mountBoard.innerHTML=board("Mountain",mc);document.querySelectorAll("#lh button").forEach((b,i)=>b.classList.toggle("on",step<9&&i===step));document.querySelectorAll("#mh button").forEach((b,i)=>b.classList.toggle("on",step>=9&&i===step-9));pips.innerHTML="";for(let i=0;i<18;i++){let q=document.createElement("i");q.className="pip"+(i>=9?" m":"");q.style.opacity=i===step?"1":".35";pips.appendChild(q)}}
function next(){if(step<17)step++;render();window.scrollTo({top:0,behavior:"smooth"})}function prev(){if(step>0)step--;render();window.scrollTo({top:0,behavior:"smooth"})}function score(){let s=prompt("이 홀 타수를 입력하세요");if(s){localStorage.setItem("golfScore"+step,s);alert("저장했습니다.")}}
function showPanel(t){const names={info:"골프장 정보",rotation:"코스 로테이션",score:"스코어카드",ai:"AI 공략 추천",memo:"메모/사진"};if(t==="score"){score();return}alert(names[t]+" 기능 화면은 다음 세부화 단계에서 연결됩니다. 현재 홀 선택·이전/다음·스코어 기록은 작동합니다.")}
render();
</script></body></html>
